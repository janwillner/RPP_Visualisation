<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 370" width="960" height="370" role="img">
<title>An XTS gantry: its track and movers (top view) and one mover seen along the track</title>
<style>
.dg{--text:#1d232b;--muted:#5d6875;--panel:#f4f6f9;--border:#b8c0cb;--accent:#0b6fa4;--belt:#d5dbe3;--ccs:#1d232b;--axis:#7e57c2;--x:#e53935;--y:#43a047;--z:#1e88e5}
@media (prefers-color-scheme:dark){.dg{--text:#dfe5ec;--muted:#8893a2;--panel:#1f242c;--border:#3a424e;--accent:#4fc3f7;--belt:#3b4656;--ccs:#f1f4f8;--axis:#b388ff;--x:#ef5350;--y:#66bb6a;--z:#42a5f5}}
.dg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}
.dg .s{font-size:11.5px}
.dg .c{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:11.5px}
.dg .h{font-weight:600}
.dg .m{fill:var(--muted)}
.dg .ink{fill:#14181d}
.dg .mid{text-anchor:middle}
.dg .end{text-anchor:end}
.dg .tx{fill:var(--x)}
.dg .ty{fill:var(--y)}
.dg .tz{fill:var(--z)}
.dg .ln{fill:none;stroke:var(--text);stroke-width:1.4}
.dg .lm{fill:none;stroke:var(--muted);stroke-width:1}
.dg .dash{stroke-dasharray:5 4}
.dg .box{fill:var(--panel);stroke:var(--border);stroke-width:1.2}
.dg .frame{fill:none;stroke:var(--border);stroke-width:1.2;stroke-dasharray:6 4}
.dg .acc{fill:none;stroke:var(--accent);stroke-width:1.6}
.dg .accf{fill:var(--accent)}
.dg .dot{fill:var(--text)}
.dg .belt{fill:var(--belt);stroke:var(--border)}
.dg .zone{fill:#5fd39a;fill-opacity:.3;stroke:#22a86b;stroke-width:1.2}
.dg .alloc{fill:#22a86b;fill-opacity:.45}
.dg .ccs{stroke:var(--ccs);stroke-width:2;stroke-dasharray:6 4}
.dg .axis{fill:none;stroke:var(--axis);stroke-width:2}
.dg .axisf{fill:var(--axis)}
.dg .x{stroke:var(--x);stroke-width:2}
.dg .y{stroke:var(--y);stroke-width:2}
.dg .z{stroke:var(--z);stroke-width:2}
.dg .state{stroke:var(--text);stroke-width:1}
.dg .detected{fill:#a9bbd3}
.dg .assigned{fill:#f5a524}
.dg .picked{fill:#5fd39a}
.dg .rejected{fill:#a78bfa}
.dg .placed{fill:#2fc6d6}
.dg .missed{fill:#ff5fa2}
.dg .mline{fill:none;stroke:#ff5fa2;stroke-width:1.6;stroke-dasharray:5 4}
.dg .limit{fill:#ff9800;fill-opacity:.12;stroke:#ff9800;stroke-width:1.4;stroke-dasharray:6 4}
.dg .work{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:1.4}
.dg .grip{fill:#3d8fe0;stroke:var(--text);stroke-width:1}
.dg .solid{fill:var(--belt);stroke:var(--text);stroke-width:1}
.dg .track{fill:none;stroke:var(--muted);stroke-width:14}
.dg .joint{stroke:var(--panel);stroke-width:2.5}
.dg .sensorpart{fill:#26c6da;stroke:var(--text);stroke-width:1}
.dg .active{fill:#5fd39a;stroke:var(--text);stroke-width:1}
.dg .fov{fill:#4fc3f7;fill-opacity:.18;stroke:#4fc3f7;stroke-width:1.4}
.dg .beam{stroke:#ffd54f;stroke-width:5;stroke-opacity:.35}
.dg .beamon{stroke-opacity:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text)"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--axis)"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--x)"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--y)"/></marker><marker id="az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--z)"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#ff5fa2"/></marker></defs>
<text x="20" y="24" class="s h">Top view</text>
<line x1="150" y1="300" x2="150" y2="60" class="track"/>
<line x1="141" y1="300" x2="159" y2="300" class="joint"/>
<line x1="141" y1="240" x2="159" y2="240" class="joint"/>
<line x1="141" y1="180" x2="159" y2="180" class="joint"/>
<line x1="141" y1="120" x2="159" y2="120" class="joint"/>
<line x1="141" y1="60" x2="159" y2="60" class="joint"/>
<text x="128" y="274" class="s m mid">1</text>
<text x="128" y="214" class="s m mid">2</text>
<text x="128" y="154" class="s m mid">3</text>
<text x="128" y="94" class="s m mid">4</text>
<rect x="137" y="205" width="26" height="30" class="solid"/>
<line x1="163" y1="220" x2="400" y2="220" class="lm"/>
<rect x="280" y="210" width="20" height="20" class="solid"/>
<line x1="300" y1="220" x2="330" y2="220" class="ln"/>
<circle cx="330" cy="220" r="8" class="grip"/>
<rect x="137" y="115" width="26" height="30" class="solid"/>
<line x1="163" y1="130" x2="400" y2="130" class="lm"/>
<rect x="200" y="120" width="20" height="20" class="solid"/>
<line x1="220" y1="130" x2="250" y2="130" class="ln"/>
<circle cx="250" cy="130" r="8" class="grip"/>
<text x="175" y="108" class="s">mover with its X axis (m_SetMover)</text>
<text x="344" y="212" class="s">flange and finger</text>
<circle cx="150" cy="300" r="5" class="accf"/>
<text x="162" y="318" class="s">track start: position 0</text>
<line x1="110" y1="300" x2="110" y2="222" class="ln" marker-end="url(#a)"/>
<line x1="110" y1="220" x2="137" y2="220" class="lm dash"/>
<text x="104" y="264" class="c end">vi_lr_Position</text>
<line x1="150" y1="192" x2="290" y2="192" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="220" y="186" class="c mid">vi_lr_X</text>
<line x1="290" y1="192" x2="290" y2="210" class="lm dash"/>
<line x1="290" y1="242" x2="330" y2="242" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="330" y1="228" x2="330" y2="242" class="lm dash"/>
<text x="310" y="258" class="c mid">vi_lr_ToolOffsetX</text>
<line x1="30" y1="336" x2="66" y2="336" class="x" marker-end="url(#ax)"/>
<line x1="30" y1="336" x2="30" y2="300" class="y" marker-end="url(#ay)"/>
<text x="70" y="340" class="s tx">X</text>
<text x="26" y="294" class="s ty">Y</text>
<text x="30" y="358" class="s m">local frame: the track runs along +Y</text>
<text x="500" y="24" class="s h">One mover, seen along the track</text>
<rect x="520" y="60" width="16" height="250" class="solid"/>
<text x="528" y="328" class="s mid">common Z axis</text>
<line x1="536" y1="120" x2="660" y2="120" class="lm dash"/>
<text x="606" y="116" class="s m">Z = 0</text>
<rect x="540" y="150" width="40" height="26" class="solid"/>
<text x="560" y="192" class="s mid">mover</text>
<line x1="592" y1="122" x2="592" y2="148" class="ln" marker-end="url(#a)"/>
<text x="598" y="140" class="c">vi_lr_Z</text>
<line x1="580" y1="163" x2="860" y2="163" class="lm"/>
<rect x="690" y="153" width="20" height="20" class="solid"/>
<polyline points="700,173 700,240 740,240" class="ln" style="stroke-width:2"/>
<circle cx="740" cy="240" r="4" class="accf"/>
<rect x="732" y="240" width="16" height="30" class="grip"/>
<text x="690" y="232" class="s end">gripper flange</text>
<line x1="560" y1="150" x2="560" y2="96" class="lm dash"/>
<line x1="700" y1="153" x2="700" y2="96" class="lm dash"/>
<line x1="560" y1="100" x2="700" y2="100" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="630" y="94" class="c mid">vi_lr_X</text>
<line x1="580" y1="150" x2="790" y2="150" class="lm dash"/>
<line x1="780" y1="152" x2="780" y2="238" class="ln" marker-end="url(#a)"/>
<line x1="744" y1="240" x2="790" y2="240" class="lm dash"/>
<text x="786" y="200" class="c">vi_lr_ToolOffsetZ</text>
<line x1="740" y1="274" x2="740" y2="294" class="lm dash"/>
<line x1="700" y1="290" x2="740" y2="290" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="720" y="308" class="c mid">vi_lr_ToolOffsetX</text>
<line x1="880" y1="336" x2="916" y2="336" class="x" marker-end="url(#ax)"/>
<line x1="880" y1="336" x2="880" y2="300" class="z" marker-end="url(#az)"/>
<text x="920" y="340" class="s tx">X</text>
<text x="876" y="294" class="s tz">Z</text>
</svg>
